<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' file: data: blob: https:; media-src 'self' blob: mediastream:; font-src 'self' file: data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Killion's Record Shelf</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <aside class="side" aria-label="Main menu">
    <div class="brand">
      <div class="disc spin" aria-hidden="true"></div>
      <div class="brand-name">Killion's Record Shelf</div>
    </div>
    <nav class="nav">
      <button class="nav-btn" data-view="records">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/></svg>My Records</button>
      <button class="nav-btn" data-view="add">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add a record</button>
      <button class="nav-btn" data-view="wish">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>Wish list</button>
      <button class="nav-btn" data-view="report">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M9 12h7M9 16h7"/></svg>Value report</button>
      <button class="nav-btn" data-view="settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>Settings</button>
      <button class="nav-btn" data-view="help">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7M12 17h.01"/></svg>Help</button>
    </nav>
    <div class="textsize">
      <div class="textsize-label">Text size</div>
      <div class="textsize-row">
        <button class="ts-btn" data-action="text-smaller" aria-label="Smaller text">A −</button>
        <button class="ts-btn big" data-action="text-bigger" aria-label="Bigger text">A +</button>
      </div>
    </div>
  </aside>
  <main id="main" tabindex="-1"></main>
</div>
<div id="modal" class="modal-wrap" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
