name: Build Windows installer

on:
  push:
    branches: [main]
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install building blocks
        run: npm install

      - name: Run self-tests
        run: npm test

      - name: Build installer (Windows 8, 8.1, 10, 11 - 32 and 64 bit)
        run: npx electron-builder --win nsis --x64 --ia32 --publish never

      - name: Keep the installer with this build
        uses: actions/upload-artifact@v4
        with:
          name: My-Record-Shelf-Setup
          path: dist/*.exe
          if-no-files-found: error

      - name: Attach the installer to the release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
